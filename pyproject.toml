# pyproject.toml: project metadata, dependencies and tool settings, managed by uv.
# Why: one file says which Python and which packages the project needs.
# Change dependencies with `uv add`, not by hand; uv.lock records exact versions.
# Check: uv sync, then make test

[project]
name = "fintech-support-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests do `import config` from the repo root
